<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <div class="container my-5">
        <div class="card shadow mx-auto" style="max-width: 600px;">
            <div class="card-header bg-info text-white text-center">
                <h1>Sign Up Form</h1>
            </div>

            <div class="card-body">

                <form id="signupForm" action="welcome.html">

                    <!-- First / Last name -->
                    <div class="mb-3">
                        <label for="fName" class="form-label">First Name:</label>
                        <input type="text" id="fName" name="fName" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="lName" class="form-label">Last Name:</label>
                        <input type="text" id="lName" name="lName" class="form-control">
                    </div>

                    <!-- Gender radios -->
                    <div class="mb-3">
                        <span class="form-label">Gender:</span>
                        <div class="form-check form-check-inline">
                            <input type="radio" name="gender" value="m" id="male" class="form-check-input">
                            <label for="male" class="form-check-label">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" name="gender" value="f" id="female" class="form-check-input">
                            <label for="female" class="form-check-label">Female</label>
                        </div>
                    </div>

                    <!-- Zip code -->
                    <div class="mb-3">
                        <label for="zip" class="form-label">Zip Code:</label>
                        <input type="text" id="zip" name="zip" class="form-control">
                    </div>

                    <div class="mb-3">
                        City: <span id="city" class="fw-bold"></span><br>
                        Latitude: <span id="latitude" class="fw-bold"></span><br>
                        Longitude: <span id="longitude" class="fw-bold"></span>
                    </div>

                    <!-- State dropdown (filled by API) -->
                    <div class="mb-3">
                        <label for="state" class="form-label">State:</label>
                        <select id="state" name="state" class="form-select">
                            <option value="">Loading states...</option>
                        </select>
                    </div>

                    <!-- County dropdown (filled by API) -->
                    <div class="mb-3">
                        <label for="county" class="form-label">Select a County:</label>
                        <select id="county" name="county" class="form-select"></select>
                    </div>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">Desired Username:</label>
                        <input type="text" id="username" name="username" class="form-control">
                        <span id="usernameError" class="fw-bold"></span>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" id="password" name="password" class="form-control">
                        <span id="suggestedPassword" class="text-muted"></span>
                    </div>

                    <div class="mb-3">
                        <label for="passwordAgain" class="form-label">Type Password Again:</label>
                        <input type="password" id="passwordAgain" name="passwordAgain" class="form-control">
                        <span id="passwordError" class="fw-bold"></span>
                    </div>

                    <button class="btn btn-info w-100">Sign up!</button>

                </form>
            </div>

            <div class="card-footer text-center text-muted">
                CST-336 Internet Programming. 2026&copy; Cao
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>

</body>
</html>
